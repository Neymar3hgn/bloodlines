[workspace]
resolver = "2"
members = ["core", "colony", "agent", "tusd", "asker"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
near-sdk = { version = "5.30", default-features = false, features = ["global-contracts"] }
near-contract-standards = "5.30"
clade-core = { path = "core" }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
