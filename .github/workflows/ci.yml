name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rules, simulator, AI path against a mock, market worker
        run: npm test
      - name: Rust rules, checked against the TypeScript engine
        run: cargo test -p clade-core
        working-directory: contracts
      - name: Rebuild the colony from the chain
        run: npm run verify
        continue-on-error: true

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web